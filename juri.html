<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juri Kaizen</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--ink:#2a1238;--mut:#7d6a8a;--bg:#fff6fb;--line:#f1dcea;--pk:#e8337a;--mint:#12b8a6;--sun:#ffd23f;--pkl:#ffe1ee;--mil:#d6f6f1;--sul:#fff0b8}
*{box-sizing:border-box;margin:0}body{font:16px/1.5 'Source Sans 3',sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Lora,Georgia,serif}button,input,select,textarea{font:inherit;color:inherit}.hide{display:none!important}
header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
header h1{font-size:26px;font-weight:700}.sp{flex:1}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:99px}
.tab{border:0;background:none;padding:8px 18px;border-radius:99px;cursor:pointer;font-weight:700;color:var(--mut);transition:.25s;white-space:nowrap}.tab.on{background:var(--pk);color:#fff}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--pkl);display:grid;place-items:center;font-weight:700;color:var(--pk);cursor:pointer;overflow:hidden;flex:none}
main{max-width:1100px;margin:auto;padding:24px 20px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.bar>*{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}.bar input[type=search]{flex:1;min-width:160px}
.btn{border:0;background:var(--pk);color:#fff;font-weight:700;padding:10px 18px;border-radius:12px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #e8337a40}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;transition:.25s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #e8337a22}
.who{display:flex;gap:10px;align-items:center;font-size:13px}.who b{display:block;font-size:14px}
.card h3{font-size:18px;line-height:1.2}.card p{color:#4a3a55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-top:auto;gap:8px}
.pill{background:var(--pkl);padding:3px 10px;border-radius:99px;font-weight:700;color:var(--ink);font-size:12px}.pill.done{background:var(--mil)}.pill.hold{background:var(--sul)}
.sc{background:var(--mint);color:#fff;border-radius:12px;padding:2px 10px;font:700 18px Lora,Georgia,serif}.sc.no{background:var(--line);color:var(--mut);font-size:12px;font-family:'Source Sans 3',sans-serif;font-weight:600;padding:5px 10px}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.ov{position:fixed;inset:0;background:#2a123866;display:grid;place-items:center;z-index:20;padding:14px;opacity:0;pointer-events:none;transition:.25s}.ov.on{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:24px;padding:24px;width:min(680px,100%);max-height:92vh;overflow:auto;transform:translateY(20px);transition:.3s}.ov.on .modal{transform:none}
.modal h2{font-size:26px;margin-bottom:10px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.modal input,.modal textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px}textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.ph{aspect-ratio:4/3;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--mut);font-size:13px}
.box{background:var(--bg);border-radius:16px;padding:14px;margin-top:16px}.dr{font-size:12px;color:var(--mut);margin-top:6px}
#login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}
#login h1{font-size:clamp(44px,9vw,84px);line-height:1.05;letter-spacing:-1px;font-weight:700;margin-bottom:18px}
.lf{display:grid;gap:10px;text-align:left}.lf input{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff}
.tw{overflow:auto;border-radius:16px}#tbl{background:#fff;padding:28px;min-width:640px}#tbl h2{font-size:28px}
table{border-collapse:collapse;width:100%;margin-top:14px;font-size:14px}th{background:var(--pk);color:#fff;text-align:left;padding:9px 10px}td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.sub td{background:var(--pkl);font-weight:700}tr.dv td{background:var(--ink);color:#fff;font-weight:700;font-family:Lora,Georgia,serif}td.n{text-align:center;font-weight:700}
#ld{position:fixed;inset:0;background:#fffffff0;z-index:50;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.25s}#ld.on{opacity:1;pointer-events:auto}
.lb{width:min(300px,80vw);text-align:center}.trk{height:10px;background:var(--pkl);border-radius:9px;overflow:hidden;margin:14px 0 8px}
#lf{height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--sun));border-radius:9px;transition:width .2s}#lp{font:700 40px Lora,Georgia,serif}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:60;transition:.35s}#toast.on{transform:translate(-50%,0)}
@media(max-width:640px){.tabs{order:3;width:100%;overflow:auto}header{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.modal h2{padding-right:44px}.x{position:sticky;top:0;z-index:3;display:grid;place-items:center;width:34px;height:34px;margin:0 0 -34px auto;border:0;border-radius:50%;background:var(--pkl);color:var(--ink);font-size:15px;cursor:pointer;transition:.2s}.x:hover{transform:rotate(90deg)}
</style></head><body>

<section id="login"><div style="width:min(380px,100%)"><h1>Juri.<br>Nilai dengan<br>adil.</h1>
<div class="lf"><input id="l_e" type="email" placeholder="Email juri" autocomplete="username"><input id="l_p" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn" id="l_go">Masuk</button><small style="color:var(--mut)">Email harus sudah didaftarkan admin di sheet "Juri". Password awal 12345.</small></div></div></section>

<div id="app" class="hide">
<header><h1>Juri</h1><nav class="tabs"><button class="tab" data-t="all">All Kaizen</button><button class="tab" data-t="sy">Sayembara</button><button class="tab" data-t="tp">Skoring Template</button></nav>
<span class="sp"></span><div class="av" id="me" title="My profile"></div></header>
<main><div class="bar" id="bar"></div><div class="grid" id="grid"></div></main></div>

<div class="ov" id="ov"><div class="modal" id="md"></div></div>
<div id="ld"><div class="lb"><div id="lp">0%</div><div class="trk"><div id="lf"></div></div><b>Tunggu ya…</b><div id="lm" style="color:var(--mut);font-size:13px"></div></div></div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx4GZOGmYPAyPl26MN-ZeeXeWQxkThHfUif6WVApFc217fdj3drazTKppNSkvUjIsKQaA/exec';
const $ = s => document.querySelector(s), E = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DIVS = ['EXATA', 'JP Smart', 'JLCT', 'J-Expert', 'MC', 'IT', 'Finance', 'Exata Daily', 'Support', 'Yanoshi'], _seen = {};
// Samakan penulisan divisi (huruf besar-kecil dan spasi) supaya filter, kartu, dan peringkat konsisten
const canon = d => { d = String(d || '').trim().replace(/\s+/g, ' '); const k = d.toLowerCase(); return DIVS.find(x => x.toLowerCase() === k) || (_seen[k] = _seen[k] || d); };
const normAll = () => { [S.me].concat(S.users, S.kz, S.sy).forEach(o => { if (o && 'divisi' in o) o.divisi = canon(o.divisi); }); };
let S = { tab: localStorage.jr_tab || 'all', tok: localStorage.jr_tok || '', me: null, users: [], kz: [], sy: [], sk: [], f: {} };

/* ---------- loader + api ---------- */
let LT, LP = 0;
const setP = p => { $('#lf').style.width = p + '%'; $('#lp').textContent = Math.round(p) + '%'; };
function loader(on, msg) {
  clearInterval(LT);
  if (on) { LP = 0; setP(0); $('#lm').textContent = msg || ''; $('#ld').classList.add('on'); LT = setInterval(() => setP(LP += (92 - LP) * .06), 120); }
  else { setP(100); setTimeout(() => $('#ld').classList.remove('on'), 250); }
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 3000); }
async function api(action, data, msg) {
  loader(1, msg); let r;
  try { r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action, token: S.tok, data }) })).json(); }
  catch (e) { loader(0); toast('Koneksi gagal, coba lagi'); throw e; }
  loader(0);
  if (!r.ok) { toast(r.error); if (/sesi/i.test(r.error)) logout(); throw new Error(r.error); }
  return r.data;
}
function apply(d) {
  if (d.token) { S.tok = d.token; localStorage.jr_tok = d.token; }
  S.me = d.me; S.users = d.users; S.kz = d.kaizen; S.sy = d.sayembara; S.sk = d.skor; normAll();
}

/* ---------- login ---------- */
window.onload = () => {
  $('#l_go').onclick = async () => {
    const email = $('#l_e').value.trim().toLowerCase(), sandi = $('#l_p').value;
    if (!email || !sandi) return toast('Isi email dan password');
    const r = await api('login', { email, sandi }, 'Masuk'); S.tok = r.token; localStorage.jr_tok = S.tok; boot();
  };
  document.querySelectorAll('.lf input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') $('#l_go').click(); });
  if (S.tok) boot();
};
async function boot() {
  try { apply(await api('load', {}, 'Mengambil data kaizen')); } catch (e) { return; }
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  if (!S.me.nama || S.me.wajibGanti) return profile(true);
  go();
}
function logout() { localStorage.removeItem('jr_tok'); location.reload(); }

/* ---------- helpers ---------- */
const U = e => S.users.find(u => u.email === e) || { nama: e, divisi: '', foto: '' };
const avatar = u => u.foto ? `<img class="av" src="${E(u.foto)}">` : `<div class="av">${E((u.nama || '?')[0]).toUpperCase()}</div>`;
const fdate = d => d ? new Date(d + 'T00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const mine = id => S.sk.find(s => s.kaizenId === id && s.juriEmail === S.me.email);
const avg = id => { const a = S.sk.filter(s => s.kaizenId === id).map(s => +s.skor); return a.length ? a.reduce((x, y) => x + y) / a.length : null; };
const who = e => { const u = U(e); return `<div class="who">${avatar(u)}<div><b>${E(u.nama)}</b>${E(u.divisi)}</div></div>`; };
function modal(h, lock) { $('#md').innerHTML = (lock ? '' : '<button class="x" onclick="close_()" aria-label="Tutup">✕</button>') + h; $('#md').scrollTop = 0; $('#ov').classList.add('on'); }
function close_() { $('#ov').classList.remove('on'); }

/* ---------- tab, filter, daftar ---------- */
function go(t) {
  if (t) { S.tab = t; localStorage.jr_tab = t; }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  $('#me').outerHTML = avatar({ nama: S.me.nama }).replace('class="av', 'id="me" title="My profile" class="av'); $('#me').onclick = () => profile();
  if (S.tab === 'tp') { $('#bar').innerHTML = `<button class="btn" id="dpng">Unduh PNG 300ppi</button><button class="btn g" id="djpg">Unduh JPG 300ppi</button>`; $('#dpng').onclick = () => dl('png'); $('#djpg').onclick = () => dl('jpg'); return table(); }
  const f = S.f[S.tab] = S.f[S.tab] || {}, divs = [...new Set(S.users.map(u => u.divisi).filter(Boolean))];
  $('#bar').innerHTML = `<select data-k="divisi"><option value="">Semua divisi</option>${divs.map(d => `<option ${f.divisi === d ? 'selected' : ''}>${E(d)}</option>`).join('')}</select>
<select data-k="skor"><option value="">Semua (sudah/belum dinilai)</option><option value="y" ${f.skor === 'y' ? 'selected' : ''}>Sudah kuberi skor</option><option value="n" ${f.skor === 'n' ? 'selected' : ''}>Belum kuberi skor</option></select>
<input type="date" data-k="due" value="${f.due || ''}" title="Due date maksimal"><select data-k="sort"><option value="new">Terbaru dulu</option><option value="old" ${f.sort === 'old' ? 'selected' : ''}>Terlama dulu</option></select>
<input type="search" data-k="q" placeholder="Cari kata apa saja…" value="${E(f.q || '')}">`;
  $('#bar').oninput = e => { f[e.target.dataset.k] = e.target.value; draw(); };
  draw();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.t));

function draw() {
  const f = S.f[S.tab], q = (f.q || '').toLowerCase();
  let a = S.tab === 'all' ? S.kz.filter(k => k.jenis !== 'sayembara').map(k => ({ ...k, kid: k.id })) : S.sy.flatMap(s => { const ks = String(s.kaizenId || '').split(',').filter(Boolean); if (!ks.length) return [{ ...s, kid: '', status: '', isi: '', penangan: '' }]; return ks.map(kid => { const k = S.kz.find(x => x.id === kid); return { ...s, cid: s.id + '|' + kid, kid, status: k ? k.status : '', isi: k ? k.isi : '', penangan: k ? k.nama : '' }; }); });
  a = a.filter(x => (!f.divisi || x.divisi === f.divisi) && (!f.due || (x.due && x.due <= f.due)) && (!f.skor || (f.skor === 'y') === !!(x.kid && mine(x.kid))) && (!q || JSON.stringify(x).toLowerCase().includes(q)));
  a.sort((x, y) => f.sort === 'old' ? x.dibuat - y.dibuat : y.dibuat - x.dibuat);
  $('#grid').innerHTML = a.length ? a.map(x => {
    const m = x.kid && mine(x.kid), st = x.status || 'belum diambil', badge = m ? `<span class="sc" title="Skor kamu">${m.skor}</span>` : `<span class="sc no">belum dinilai</span>`;
    return `<div class="card" data-id="${x.cid || x.id}">${who(x.email)}<h3>${S.tab === 'all' ? E(x.kategori) : 'Sayembara'}</h3>
<p>${E(S.tab === 'all' ? x.isi : x.problem) || '<i>Belum diisi</i>'}</p>${S.tab === 'sy' ? `<div class="who">Ditangani: <b>${x.penangan ? E(x.penangan) : 'belum ada'}</b></div>` : ''}
<div class="meta"><span>Due ${fdate(x.due)}</span><span class="pill ${st}">${st}</span>${badge}</div></div>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1">Tidak ada data yang cocok dengan filter.</div>`;
  document.querySelectorAll('[data-id]').forEach(c => c.onclick = () => detail(c.dataset.id));
}

/* ---------- detail + form skor (draft otomatis) ---------- */
function detail(id) {
  const [sid, skid] = String(id).split('|'), sy = S.tab === 'sy' ? S.sy.find(x => x.id === sid) : null, kid = sy ? skid : id, k = S.kz.find(x => x.id === kid);
  const ph = (s, t) => `<div><label>${t}</label>${s ? `<img src="${E(s)}" style="width:100%;border-radius:14px">` : '<div class="ph">Belum ada foto</div>'}</div>`;
  let body = `<h2>${sy ? 'Sayembara' : E(k.kategori)}</h2>${who((sy || k).email)}`;
  if (sy) body += `<label>Problem</label><p>${E(sy.problem)}</p><div class="two"><div><label>Due date</label>${fdate(sy.due)}</div><div><label>Ditangani oleh</label>${k ? E(k.nama) : 'Belum ada'}</div></div>`;
  if (k) body += `<label>Detail kaizen${sy ? ' (solusi)' : ''}</label><p>${E(k.isi) || '-'}</p><div class="two"><div><label>Due date</label>${fdate(k.due)}</div><div><label>Status</label>${k.status}</div></div><div class="two">${ph(k.before, 'Before')}${ph(k.after, 'After')}</div>`;
  const ok = k && (k.jenis !== 'sayembara' || k.status === 'done'), m = k && mine(k.id), dk = k && 'jr_draft_' + S.me.email + '_' + k.id, dr = dk && !m && JSON.parse(localStorage[dk] || 'null') || {};
  const others = k ? S.sk.filter(s => s.kaizenId === k.id && s.juriEmail !== S.me.email) : [];
  body += ok ? `<div class="box"><b>Penilaianmu</b><label>Skor (1–100)</label><input id="sk" type="number" min="1" max="100" value="${m ? m.skor : dr.skor || ''}"><label>Komentar</label><textarea id="km">${E(m ? m.komentar : dr.km)}</textarea><div class="dr" id="dr"></div></div>
${others.length ? `<div class="dr">Juri lain: ${others.map(o => E(o.juriNama) + ' ' + o.skor).join(', ')}</div>` : ''}`
    : `<div class="box">${k ? 'Sayembara ini baru bisa dinilai setelah statusnya <b>done</b>.' : 'Sayembara ini belum diambil siapa pun.'}</div>`;
  modal(body + `<div class="act"><button class="btn g" onclick="close_()">Tutup</button>${ok ? '<button class="btn" id="sv">Simpan skor</button>' : ''}</div>`);
  if (!ok) return;
  $('#md').oninput = () => { if (!m) { try { localStorage[dk] = JSON.stringify({ skor: $('#sk').value, km: $('#km').value }); $('#dr').textContent = 'Draft tersimpan otomatis ✓'; } catch (e) { } } };
  $('#sv').onclick = async () => {
    const skor = +$('#sk').value; if (!(skor >= 1 && skor <= 100)) return toast('Skor harus 1 sampai 100');
    apply(await api('saveScore', { kaizenId: k.id, skor, komentar: $('#km').value }, 'Menyimpan skor')); localStorage.removeItem(dk); close_(); toast('Skor tersimpan ✓'); go();
  };
}

/* ---------- skoring template (tabel rangkuman) ---------- */
function table() {
  const sc = S.kz.map(k => ({ k, a: avg(k.id) })).filter(x => x.a != null), by = {};
  sc.forEach(x => { const u = U(x.k.email); ((by[u.divisi || '-'] = by[u.divisi || '-'] || {})[u.nama] = by[u.divisi || '-'][u.nama] || []).push(x); });
  const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ','), all = sc.length ? sc.reduce((s, x) => s + x.a, 0) / sc.length : 0;
  let h = `<div class="tw"><div id="tbl"><h2>Rekap Skor Kaizen</h2><div style="color:var(--mut)">Dicetak ${new Date().toLocaleDateString('id-ID', { dateStyle: 'long' })} · ${sc.length} kaizen dinilai</div>
<table><tr><th>Nama</th><th>Jenis</th><th>Kaizen</th><th>Skor</th><th>Komentar</th></tr>`;
  Object.keys(by).sort().forEach(d => {
    h += `<tr class="dv"><td colspan="5">${E(d)}</td></tr>`;
    Object.keys(by[d]).sort().forEach(n => {
      const it = by[d][n]; h += it.map(x => `<tr><td>${E(n)}</td><td>${x.k.jenis}</td><td>${E(x.k.kategori)}: ${E((x.k.isi || x.k.masalah).slice(0, 90))}</td><td class="n">${fmt(x.a)}</td><td>${S.sk.filter(s => s.kaizenId === x.k.id && s.komentar).map(s => E(s.komentar)).join(' / ')}</td></tr>`).join('');
      h += `<tr class="sub"><td colspan="3">Rata-rata ${E(n)}</td><td class="n">${fmt(it.reduce((s, x) => s + x.a, 0) / it.length)}</td><td></td></tr>`;
    });
  });
  $('#grid').innerHTML = (sc.length ? h + `<tr class="sub"><td colspan="3">Rata-rata keseluruhan</td><td class="n">${fmt(all)}</td><td></td></tr></table></div></div>` : '<div class="empty" style="grid-column:1/-1">Belum ada kaizen yang diberi skor.</div>');
}
async function dl(t) {
  if (!$('#tbl')) return toast('Belum ada tabel untuk diunduh');
  loader(1, 'Membuat gambar resolusi tinggi');
  try {
    const c = await html2canvas($('#tbl'), { scale: 300 / 96, backgroundColor: '#ffffff', useCORS: true }), a = document.createElement('a');
    a.download = 'rekap-skor-kaizen.' + t; a.href = c.toDataURL(t === 'png' ? 'image/png' : 'image/jpeg', .95); a.click();
  } catch (e) { toast('Gagal membuat gambar'); }
  loader(0);
}

/* ---------- profil ---------- */
function profile(first) {
  const m = S.me;
  modal(`<h2>${first ? 'Lengkapi profil juri' : 'My profile'}</h2><div class="dr">Login sebagai <b>${E(m.email)}</b></div><label>Nama</label><input id="pn" value="${E(m.nama)}">
<label>${m.wajibGanti ? 'Buat password baru (wajib)' : 'Ganti password (kosongkan jika tidak)'}</label><input id="pw" type="password" placeholder="Minimal 5 karakter" autocomplete="new-password">
<div class="act">${first ? '' : '<button class="btn g" onclick="logout()">Logout</button><button class="btn g" onclick="close_()">Tutup</button>'}<button class="btn" id="ps">Simpan</button></div>`, first);
  $('#ps').onclick = async () => {
    const d = { nama: $('#pn').value, sandi: $('#pw').value }; if (!d.nama.trim()) return toast('Nama wajib diisi'); if (m.wajibGanti && !d.sandi) return toast('Buat password baru dulu ya');
    apply(await api('profile', d, 'Menyimpan profil')); close_(); toast('Profil tersimpan ✓'); go();
  };
}
</script></body></html>
