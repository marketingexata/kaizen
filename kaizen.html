<section id="login"><div style="width:min(380px,100%)"><h1>Kaizen.<br>Perbaikan kecil,<br>dampak besar.</h1>
<div class="lf"><input id="l_e" type="email" placeholder="Email kamu" autocomplete="username"><input id="l_n" class="hide" placeholder="Nama lengkap"><input id="l_p" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn" id="l_go">Masuk</button><a href="#" id="l_fp">Lupa password?</a><a href="#" id="l_sw">Belum punya akun? Daftar</a><small id="l_h" class="hide" style="color:var(--mut)">Password awal 12345. Kamu akan diminta menggantinya setelah masuk.</small></div></div></section>

<div id="app" class="hide">
<header><h1>Kaizen</h1><button class="hb" id="hb" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path class="hb-o" d="M4 7h16M4 12h16M4 17h16"/><path class="hb-c" d="M6 6l12 12M18 6L6 18"/></svg></button>
<span class="sp"></span><div class="av" id="me" title="My profile"></div></header>
<nav class="tabs" id="nav" aria-label="Menu utama"><div class="brand"><img src="https://marketingexata.github.io/kontenmarketing/EXATAGROUP.png" alt="Exata Group"></div><button class="tab" data-t="my">My Kaizen</button><button class="tab" data-t="all">All Kaizen</button><button class="tab" data-t="ide">Ide Kaizen</button><button class="tab" data-t="sy">Sayembara</button><button class="tab" data-t="lb">Peringkat</button><button class="tab" data-t="sp">Sharing Personal</button></nav>
<div class="scrim" id="scrim"></div>
<main><div id="hd"></div><div id="nt"></div><div id="stats"></div><div class="bar" id="bar"></div><div class="grid" id="grid"></div></main>
<button class="btn fab" id="fab"></button>
</div>

<div class="ov" id="ov"><div class="modal" id="md"></div></div>
<div id="ld"><div class="lb"><div id="lp">0%</div><div class="trk"><div id="lf"></div></div><b>Tunggu ya…</b><div id="lm" style="color:var(--mut);font-size:13px"></div></div></div>
<div class="zm" id="zm"><div id="zs"><img id="zi" alt="Foto"></div><button class="x zx" onclick="zoomClose()" aria-label="Tutup">✕</button><div class="zc"><button onclick="zoomBy(1/1.4)">−</button><button onclick="zoomReset()">Reset</button><button onclick="zoomBy(1.4)">+</button></div></div>
<div id="toast"></div>

<script>
/* ====== ISI 2 BARIS INI ====== */
const API = 'https://script.google.com/macros/s/AKfycbxtb9jjzL4FVHz5Im60obxQp2DYZjuKxmP7SUxFUy5FxMcHsN_ltEh9HLVxu2xjP8wdlg/exec';
/* Tambah kategori di sini */
const CATS = ['Cost', 'Environment', 'Time', 'Manpower'];
const STAT = ['plan', 'progress', 'hold', 'done'];
const DIVS = ['EXATA', 'JP Smart', 'JLCT', 'J-Expert', 'MC', 'IT', 'Finance', 'Exata Daily', 'Support', 'Yanoshi'], _seen = {};
// Samakan penulisan divisi (huruf besar-kecil dan spasi) supaya filter, kartu, dan peringkat konsisten
const canon = d => { d = String(d || '').trim().replace(/\s+/g, ' '); const k = d.toLowerCase(); return DIVS.find(x => x.toLowerCase() === k) || (_seen[k] = _seen[k] || d); };
const normAll = () => { [S.me].concat(S.users, S.kz, S.sy).forEach(o => { if (o && 'divisi' in o) o.divisi = canon(o.divisi); }); };
const divPick = (n, v) => { const o = v && !DIVS.includes(v); return `<div class="chk">${DIVS.map(d => `<label class="cb"><input type="radio" name="${n}" value="${d}" ${v === d ? 'checked' : ''}><span>${d}</span></label>`).join('')}<label class="cb"><input type="radio" name="${n}" value="__o" ${o ? 'checked' : ''}><span>Isi sendiri</span></label></div><input id="${n}_o" class="${o ? '' : 'hide'}" placeholder="Tulis divisimu" value="${o ? E(v) : ''}" style="margin-top:8px">`; };
const divGet = n => { const r = document.querySelector(`[name=${n}]:checked`); return !r ? '' : r.value === '__o' ? $('#' + n + '_o').value.trim() : r.value; };
document.addEventListener('change', e => { const o = e.target.type === 'radio' && document.getElementById(e.target.name + '_o'); if (o) o.classList.toggle('hide', e.target.value !== '__o'); });

const $ = s => document.querySelector(s), E = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = { tab: localStorage.kz_tab || 'my', tok: localStorage.kz_tok || '', me: null, users: [], kz: [], sy: [], cu: [], ko: {}, li: {}, sub: 'new', f: {} };

/* ---------- loader + api ---------- */
let LT, LP = 0;
const setP = p => { $('#lf').style.width = p + '%'; $('#lp').textContent = Math.round(p) + '%'; };
function loader(on, msg) {
  clearInterval(LT);
  if (on) { LP = 0; setP(0); $('#lm').textContent = msg || ''; $('#ld').classList.add('on'); LT = setInterval(() => setP(LP += (92 - LP) * .06), 120); }
  else { setP(100); setTimeout(() => $('#ld').classList.remove('on'), 250); }
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 3000); }
async function api(action, data, msg) {
  loader(1, msg); let r;
  try { r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action, token: S.tok, data }) })).json(); }
  catch (e) { loader(0); toast('Koneksi gagal, coba lagi'); throw e; }
  loader(0);
  if (!r.ok) { toast(r.error); if (/sesi/i.test(r.error)) logout(); throw new Error(r.error); }
  return r.data;
}
function apply(d) {
  if (d.token) { S.tok = d.token; localStorage.kz_tok = d.token; } S.me = d.me; S.users = d.users; S.kz = d.kaizen; S.sy = d.sayembara; S.cu = d.curhat || []; S.ko = d.komen || {}; S.li = d.like || {}; normAll(); }

/* ---------- login ---------- */
let REG = false;
window.onload = () => {
  $('#l_sw').onclick = e => {
    e.preventDefault(); REG = !REG;
    $('#l_n').classList.toggle('hide', !REG); $('#l_p').classList.toggle('hide', REG); $('#l_h').classList.toggle('hide', !REG); $('#l_fp').classList.toggle('hide', REG);
    $('#l_go').textContent = REG ? 'Daftar' : 'Masuk'; $('#l_sw').textContent = REG ? 'Sudah punya akun? Masuk' : 'Belum punya akun? Daftar';
  };
    const fp = $('#l_fp'); fp.onclick = async e => { e.preventDefault(); const email = $('#l_e').value.trim().toLowerCase(); if (!email) return toast('Isi email dulu, lalu klik Lupa password');
      await api('forgot', { email }, 'Mengirim password sementara'); toast('Jika email terdaftar, password sementara sudah dikirim. Cek inbox dan spam.'); };
  $('#l_go').onclick = async () => {
    const email = $('#l_e').value.trim().toLowerCase(), nama = $('#l_n').value.trim(), sandi = $('#l_p').value;
    if (!email || (REG ? !nama : !sandi)) return toast(REG ? 'Isi email dan nama' : 'Isi email dan password');
    const r = await api(REG ? 'register' : 'login', { email, nama, sandi }, REG ? 'Membuat akun' : 'Masuk');
    S.tok = r.token; localStorage.kz_tok = S.tok; boot();
  };
  document.querySelectorAll('.lf input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') $('#l_go').click(); });
  if (S.tok) boot();
};
async function boot() {
  try { apply(await api('load', {}, 'Mengambil data')); } catch (e) { return; }
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  if (!S.me.divisi || S.me.wajibGanti) return profile(true);
  go();
}
function logout() { localStorage.removeItem('kz_tok'); location.reload(); }

/* ---------- helpers ---------- */
const U = e => S.users.find(u => u.email === e) || { nama: e, divisi: '', foto: '' };
const avatar = (u, cls = '') => u.foto ? `<img class="av ${cls}" src="${E(u.foto)}">` : `<div class="av ${cls}">${E((u.nama || '?')[0]).toUpperCase()}</div>`;
const fdate = d => d ? new Date(d + 'T00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
function img(file, max = 1600) {
  return new Promise(res => {
    const fr = new FileReader(); fr.onload = () => { const i = new Image(); i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8)); }; i.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
function modal(h, lock) { $('#md').innerHTML = (lock ? '' : '<button class="x" onclick="close_()" aria-label="Tutup">✕</button>') + h; $('#md').scrollTop = 0; $('#ov').classList.add('on'); }
function close_() { $('#ov').classList.remove('on'); }

/* ---------- tabs, filter, list ---------- */
const FIELDS = {
  my: ['status', 'jenis', 'nilai', 'due', 'sort', 'q'], all: ['divisi', 'jenis', 'sort', 'q'], ide: ['status', 'divisi', 'jenis', 'sort', 'q'], sy: ['divisi', 'sort', 'q'], lb: [], sp: []
};
function go(t) {
  const prev = S.tab;
  if (t) { S.tab = t; localStorage.kz_tab = t; }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  $('#me').outerHTML = avatar(S.me).replace('class="av', 'id="me" title="My profile" class="av'); $('#me').onclick = () => profile();
  $('#fab').textContent = S.tab === 'sy' ? '+ Sayembara baru' : '+ Kaizen baru'; $('#fab').onclick = () => S.tab === 'sy' ? newSy() : form(); $('#fab').classList.toggle('hide', ['lb', 'sp'].includes(S.tab));
  const TT = { my: ['Kaizen saya', `Halo, ${E(S.me.nama.split(' ')[0])} 👋 Yuk catat perbaikan kecilmu hari ini.`], all: ['Semua kaizen', 'Kaizen yang sudah selesai (done) dari seluruh tim.'], ide: ['Ide kaizen', 'Ide yang masih berjalan (plan, progress, hold) dan belum selesai.'], sy: ['Sayembara', 'Masalah yang butuh bantuan tim. Satu sayembara bisa ditangani maksimal 3 orang.'], lb: ['Peringkat', 'Diurutkan dari rata-rata skor juri.'], sp: ['Sharing personal', 'Ruang aman untuk bercerita. Hanya kamu dan juri/manajemen yang bisa melihatnya.'] };
  $('#hd').innerHTML = `<h2>${TT[S.tab][0]}</h2><p>${TT[S.tab][1]}</p>`;
  const f = S.f[S.tab] = S.f[S.tab] || {}, divs = [...new Set(S.users.map(u => u.divisi).filter(Boolean))];
  const mk = {
    status: `<select data-k="status"><option value="">Semua status</option>${(S.tab === 'ide' ? STAT.slice(0, 3) : STAT).map(s => `<option ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`,
    jenis: `<select data-k="jenis"><option value="">Pribadi + sayembara</option><option value="pribadi" ${f.jenis === 'pribadi' ? 'selected' : ''}>Pribadi</option><option value="sayembara" ${f.jenis === 'sayembara' ? 'selected' : ''}>Sayembara</option></select>`,
    nilai: `<select data-k="nilai"><option value="">Semua (sudah/belum dinilai)</option><option value="y" ${f.nilai === 'y' ? 'selected' : ''}>Sudah dinilai</option><option value="n" ${f.nilai === 'n' ? 'selected' : ''}>Belum dinilai</option></select>`,
    divisi: `<select data-k="divisi"><option value="">Semua divisi</option>${divs.map(d => `<option ${f.divisi === d ? 'selected' : ''}>${E(d)}</option>`).join('')}</select>`,
    due: `<input type="date" data-k="due" value="${f.due || ''}" title="Due date maksimal">`,
    sort: `<select data-k="sort"><option value="new">Terbaru dulu</option><option value="old" ${f.sort === 'old' ? 'selected' : ''}>Terlama dulu</option></select>`,
    q: `<input type="search" data-k="q" placeholder="Cari kata apa saja…" value="${E(f.q || '')}">`
  };
  $('#bar').innerHTML = FIELDS[S.tab].map(k => mk[k]).join('');
  $('#bar').oninput = e => { f[e.target.dataset.k] = e.target.value; draw(); };
  draw();
  if (S.tab === 'sp' && (t ? prev !== 'sp' : !sessionStorage.kz_sp)) welcome();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.t));

function draw() {
  stats(); notif(); if (S.tab === 'lb') return board(); if (S.tab === 'sp') return spView();
  const f = S.f[S.tab] || {}, q = (f.q || '').toLowerCase();
  let a = S.tab === 'sy' ? S.sy : S.kz.filter(k => S.tab === 'all' ? k.status === 'done' : S.tab === 'ide' ? k.status !== 'done' : isMine(k));
  a = a.filter(x => (!f.status || x.status === f.status) && (!f.nilai || (f.nilai === 'y') === scored(x)) && (!f.jenis || x.jenis === f.jenis) && (!f.divisi || x.divisi === f.divisi) && (!f.due || (x.due && x.due <= f.due)) && (!q || JSON.stringify(x).toLowerCase().includes(q)));
  a.sort((x, y) => f.sort === 'old' ? x.dibuat - y.dibuat : y.dibuat - x.dibuat);
  $('#grid').innerHTML = a.length ? a.map(S.tab === 'sy' ? cardSy : cardKz).join('') : `<div class="empty" style="grid-column:1/-1">Belum ada data di sini.<br>Coba ubah filter atau tambah yang baru.</div>`;
  document.querySelectorAll('[data-id]').forEach(c => c.onclick = e => { if (e.target.closest('button')) return; S.tab === 'sy' ? 0 : (S.tab === 'my' ? form(c.dataset.id) : view(c.dataset.id)); });
  document.querySelectorAll('[data-take]').forEach(b => b.onclick = () => take(b.dataset.take));
  document.querySelectorAll('[data-delsy]').forEach(b => b.onclick = async () => { if (!confirm('Hapus sayembara ini?')) return; apply(await api('deleteSayembara', { id: b.dataset.delsy }, 'Menghapus sayembara')); toast('Sayembara dihapus'); go('sy'); });
  document.querySelectorAll('[data-dc]').forEach(b => b.onclick = e => { e.stopPropagation(); discuss(b.dataset.dc); });
  document.querySelectorAll('.card').forEach((c, i) => c.style.setProperty('--i', Math.min(i, 12)));
  document.querySelectorAll('.clp').forEach(p => { const b = p.nextElementSibling; if (p.scrollHeight > p.clientHeight + 1) { b.classList.remove('hide'); b.onclick = () => { const o = p.classList.toggle('open'); b.textContent = o ? 'Tutup' : 'Lihat selengkapnya'; }; } });
}
const who = (e, d) => { const u = U(e); return `<div class="who">${avatar(u)}<div><b>${E(u.nama)}</b>${E(u.divisi)}</div></div>`; };
const SL = { plan: 'Rencana', progress: 'Berjalan', hold: 'Tertahan', done: 'Selesai' }, SN = { plan: 1, progress: 2, hold: 2, done: 4 };
const thumbs = k => (k.before || k.after) ? `<div class="th">${['before', 'after'].map(n => `<div ${k[n] ? `data-zoom="${E(k[n])}" title="Klik untuk perbesar" ` : ''}style="${k[n] ? `background-image:url(${E(k[n])});cursor:zoom-in` : ''}"><em>${n === 'before' ? 'Before' : 'After'}</em></div>`).join('')}</div>` : '';
const cardKz = k => `<div class="card s-${k.status}" data-id="${k.id}">${who(k.email)}
<div class="stg">${[1, 2, 3, 4].map(i => `<span class="${i <= SN[k.status] ? 'on' : ''}"></span>`).join('')}</div>${thumbs(k)}
<h3>${E(k.kategori)}</h3>${roleTag(k)}${k.jenis === 'sayembara' ? `<span class="tag">★ ${E(k.masalah.split(':')[0])}</span>` : ''}
<p>${E(k.isi) || '<i>Belum diisi</i>'}</p><div class="meta"><span>Due ${fdate(k.due)}</span><span class="pill">${SL[k.status] || k.status}</span></div>${sx(k.id)}${dinilai(k)}${juriNote(k)}${peran(k)}</div>`;

const t = (c, v, l) => `<div class="st" style="--c:${c}"><i></i><b>${v}</b><span>${l}</span></div>`;
const fmt = v => v == null ? '–' : (Math.round(v * 10) / 10).toString().replace('.', ',');
function podium(rows, sub) {
  const pd = (r, i) => `<div class="pd r${i + 1}"><span class="rk">${i + 1}</span>${avatar(r.u)}<b>${E(r.u.nama)}</b><small>${E(r.u.divisi)}</small><span class="sv">${fmt(r.a)}</span><small>${sub(r)}</small></div>`;
  const top = rows.slice(0, 3), ord = [[top[1], 1], [top[0], 0], [top[2], 2]].filter(x => x[0]).map(x => pd(x[0], x[1])).join('');
  $('#grid').innerHTML = rows.length ? `<div style="grid-column:1/-1"><div class="pod">${ord}</div><div class="lst">${rows.slice(3).map((r, i) => `<div class="lr"><span class="n">${i + 4}</span>${avatar(r.u)}<div><b>${E(r.u.nama)}</b> <small>${E(r.u.divisi)}</small><div class="bb"><i style="width:${r.a || 0}%"></i></div></div><div class="rt"><b>${fmt(r.a)}</b><small>${sub(r)}</small></div></div>`).join('')}</div></div>` : '<div class="empty" style="grid-column:1/-1">Belum ada skor untuk diperingkat.</div>';
}

function stats() {
  const me = S.kz.filter(isMine), n = s => me.filter(k => k.status === s).length, sc = me.filter(k => k.nilai && k.nilai.length).map(rata);
  $('#stats').innerHTML = S.tab === 'my' ? t('#e0e7ff', me.length, 'Kaizen saya') + t('#fff2c9', n('progress'), 'Sedang berjalan') + t('#d8f5ea', n('done'), 'Selesai') + t('#ffe3ef', fmt(sc.length ? sc.reduce((a, b) => a + b) / sc.length : null), 'Rata-rata skor juri')
    : S.tab === 'all' ? (() => { const d = S.kz.filter(k => k.status === 'done'); return t('#d8f5ea', d.length, 'Kaizen selesai') + t('#fff2c9', new Set(d.flatMap(k => [k.email].concat(k.eksStatus === 'acc' && k.eksekutor ? [k.eksekutor] : []))).size, 'Kontributor') + t('#ffe3ef', d.filter(scored).length, 'Sudah dinilai'); })()
    : S.tab === 'ide' ? (() => { const a = S.kz.filter(k => k.status !== 'done'), c = x => a.filter(k => k.status === x).length; return t('#e0e7ff', a.length, 'Total ide') + t('#e0e7ff', c('plan'), 'Rencana') + t('#fff2c9', c('progress'), 'Berjalan') + t('#ffe3ef', c('hold'), 'Tertahan'); })() : S.tab === 'sy' ? t('#e0e7ff', S.sy.length, 'Sayembara') + t('#fff2c9', S.sy.filter(s => takers(s).length < 3).length, 'Masih butuh penangan') + t('#d8f5ea', S.sy.filter(s => s.ambilEmail).length, 'Sudah diambil') : '';
}
function board() {
  const m = {};
  S.kz.forEach(k => {
    const hs = [k.email]; // kaizen done yang eksekutornya sudah acc dihitung juga untuk eksekutor
    if (k.status === 'done' && k.eksStatus === 'acc' && k.eksekutor && k.eksekutor !== k.email) hs.push(k.eksekutor);
    hs.forEach(e => { const r = m[e] = m[e] || { u: U(e), n: 0, d: 0, s: [] }; r.n++; if (k.status === 'done') r.d++; if (k.nilai && k.nilai.length) r.s.push(rata(k)); });
  });
  const rows = Object.values(m).map(r => ({ ...r, a: r.s.length ? r.s.reduce((x, y) => x + y) / r.s.length : null })).sort((x, y) => (y.a ?? -1) - (x.a ?? -1) || y.d - x.d || y.n - x.n);
  podium(rows, r => `${r.d}/${r.n} selesai`);
}
const takers = s => String(s.ambilEmail || '').split(',').filter(Boolean);
const cardSy = s => { const t = takers(s), mine = t.includes(S.me.email);
  return `<div class="card s-plan" style="cursor:default">${who(s.email)}<h3>Butuh bantuan</h3><p class="clp">${E(s.problem)}</p><button type="button" class="mr hide">Lihat selengkapnya</button>
${t.length ? `<div class="tk"><small>Sedang ditangani oleh (${t.length}/3)</small>${t.map(e => who(e)).join('')}</div>` : ''}
${sx(s.id)}<div class="meta"><span>Due ${fdate(s.due)}</span>${mine ? '<span class="pill done">Kamu ikut menangani</span>' : t.length >= 3 ? '<span class="pill hold">Penuh 3/3</span>' : `<button class="btn" data-take="${s.id}">Aku tangani ini</button>`}</div>${s.email === S.me.email && !t.length ? `<button class="btn dn" data-delsy="${s.id}">Hapus sayembaraku</button>` : ''}</div>`; };

async function take(id) {
  if (!confirm('Ikut menangani sayembara ini? Maksimal 3 orang, dan akan masuk ke My Kaizen kamu.')) return;
  apply(await api('takeSayembara', { id }, 'Mengambil sayembara')); toast('Sayembara masuk ke My Kaizen'); go('my');
}

/* ---------- nilai dari juri ---------- */
const rata = k => Math.round(k.nilai.reduce((s, n) => s + Number(n.skor), 0) / k.nilai.length * 10) / 10;
const scored = k => !!((k.nilai && k.nilai.length) || k.dinilai);
const dinilai = k => k.nilai && k.nilai.length ? `<span class="ok">✓ Sudah dinilai · skor ${rata(k)}</span>` : k.dinilai ? `<span class="ok">✓ Sudah dinilai</span>` : '';
const nilaiBox = k => k.nilai && k.nilai.length ? `<div class="nb"><b>✓ Sudah dinilai · rata-rata ${rata(k)}</b>${k.nilai.map(n => `<p><b>${E(n.juri)}: ${E(n.skor)}</b>${n.komentar ? '<br>' + E(n.komentar) : ''}</p>`).join('')}</div>` : '';

/* ---------- PIC & Eksekutor, catatan juri ---------- */
const ROLES = { pic: ['pic', 'picStatus', 'picCatatan', 'PIC'], eksekutor: ['eksekutor', 'eksStatus', 'eksCatatan', 'Eksekutor'] };
const accepted = k => [k.picStatus === 'acc' && k.pic, k.eksStatus === 'acc' && k.eksekutor].filter(Boolean);
// yang boleh ubah status & foto: pembuat, kecuali PIC/Eksekutor lain sudah acc
const editors = k => { const a = accepted(k); return a.some(e => e !== k.email) ? a : [k.email]; };
const roleOf = (k, e = S.me.email) => [k.pic === e && k.picStatus === 'acc' ? 'PIC' : '', k.eksekutor === e && k.eksStatus === 'acc' ? 'Eksekutor' : ''].filter(Boolean).join(' & ');
const isMine = k => k.email === S.me.email || !!(k.email !== S.me.email && roleOf(k));
const stT = x => x === 'acc' ? '✓ setuju' : x === 'tolak' ? '✗ menolak' : '⏳ menunggu';

/* ---------- zoom foto (klik gambar: perbesar, geser, cubit/scroll) ---------- */
const Z = { s: 1, x: 0, y: 0, p: new Map(), d0: 1, s0: 1 };
const zApply = () => { $('#zi').style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`; };
const zd = () => { const a = [...Z.p.values()]; return Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) || 1; };
function zoom(src) { if (!src) return; $('#zi').src = src; Z.s = 1; Z.x = Z.y = 0; zApply(); $('#zm').classList.add('on'); }
function zoomClose() { $('#zm').classList.remove('on'); $('#zi').removeAttribute('src'); }
function zoomBy(f) { Z.s = Math.min(6, Math.max(1, Z.s * f)); if (Z.s === 1) Z.x = Z.y = 0; zApply(); }
function zoomReset() { Z.s = 1; Z.x = Z.y = 0; zApply(); }
(() => {
  const z = $('#zs');
  z.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  z.addEventListener('dblclick', () => { Z.s > 1 ? zoomReset() : zoomBy(2.5); });
  z.addEventListener('pointerdown', e => { z.setPointerCapture(e.pointerId); Z.p.set(e.pointerId, [e.clientX, e.clientY]); if (Z.p.size === 2) { Z.d0 = zd(); Z.s0 = Z.s; } });
  z.addEventListener('pointermove', e => {
    const o = Z.p.get(e.pointerId); if (!o) return; const n = [e.clientX, e.clientY];
    if (Z.p.size === 2) { Z.p.set(e.pointerId, n); Z.s = Math.min(6, Math.max(1, Z.s0 * zd() / Z.d0)); }
    else if (Z.s > 1) { Z.x += n[0] - o[0]; Z.y += n[1] - o[1]; Z.p.set(e.pointerId, n); }
    zApply();
  });
  const end = e => { Z.p.delete(e.pointerId); if (Z.s === 1) { Z.x = Z.y = 0; zApply(); } };
  z.addEventListener('pointerup', end); z.addEventListener('pointercancel', end);
  document.addEventListener('click', e => { const t = e.target.closest('[data-zoom]'); if (t) { e.stopPropagation(); zoom(t.dataset.zoom); } }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') zoomClose(); });
})();

  $('#sp_go').onclick = async () => {
    const d = get(); if (!d.problem) return toast('Tulis dulu masalahnya ya 🙂');
    apply(await api('addCurhat', d, 'Mengirim curhatmu')); localStorage.removeItem(spDraft()); S.sub = 'my'; toast('Curhatmu sudah terkirim 💌'); spView(); confetti();
  };
}

/* ---------- suka (like) & komentar anonim ---------- */
const sx = id => { const l = S.li[id] || { n: 0, me: false }, c = (S.ko[id] || []).length; return `<button type="button" class="sx ${l.me ? 'on' : ''}" data-dc="${id}" title="Suka & komentar">👍 ${l.n} · 💬 ${c}</button>`; };
function discuss(id, keep) {
  const k = S.kz.find(x => x.id === id), s = k ? null : S.sy.find(x => x.id === id), o = k || s; if (!o) return;
  const l = S.li[id] || { n: 0, me: false }, cs = S.ko[id] || [], own = o.email === S.me.email;
  modal(`<h2>${k ? E(k.kategori) : 'Sayembara'}</h2>${who(o.email)}<p class="dsc">${E(snip(k ? (k.isi || k.masalah) : s.problem, 220))}</p>
<button class="btn ${l.me ? '' : 'g'}" id="dlk" ${own ? 'disabled title="Tidak bisa menyukai punya sendiri"' : ''}>👍 ${l.me ? 'Kamu menyukai ini' : 'Suka'} · ${l.n}</button>
<h3 style="margin-top:18px">Komentar (${cs.length})</h3><div class="cml">${cs.length ? cs.map(c => `<div class="cm ${c.mine ? 'me' : ''}"><b>${c.mine ? 'Kamu 🤫 (hanya kamu yang tahu ini kamu)' : 'Anonim ' + c.a}</b><small>${fdt(c.dibuat)}</small><p>${E(c.teks)}</p>${c.mine ? `<button type="button" class="mr" data-dkm="${c.id}">Hapus komentarku</button>` : ''}</div>`).join('') : '<div class="empty" style="padding:20px 0">Belum ada komentar. Jadilah yang pertama 💬</div>'}</div>
<label>Tulis komentar (nama kamu disembunyikan dari user lain)</label><textarea id="cmt" maxlength="500" placeholder="Kasih masukan atau semangat yang membangun ya…">${E(keep)}</textarea>
<div class="act"><button class="btn g" onclick="close_()">Tutup</button><button class="btn" id="cms">Kirim anonim</button></div>`);
  const again = r => { apply(r); draw(); discuss(id, $('#cmt') ? $('#cmt').value : ''); };
  $('#dlk').onclick = async () => again(await api('toggleLike', { targetId: id }, 'Menyimpan'));
  $('#cms').onclick = async () => { const t = $('#cmt').value.trim(); if (!t) return toast('Komentar masih kosong'); apply(await api('addKomen', { targetId: id, teks: t }, 'Mengirim komentar')); draw(); discuss(id); toast('Komentar terkirim (anonim) ✓'); };
  document.querySelectorAll('[data-dkm]').forEach(b => b.onclick = async () => { if (!confirm('Hapus komentarmu?')) return; apply(await api('deleteKomen', { id: b.dataset.dkm }, 'Menghapus komentar')); draw(); discuss(id, $('#cmt') ? $('#cmt').value : ''); });
}

function confetti() {
  const c = ['#4f6bff', '#27c6a3', '#ffd23f', '#ff6b9a'];
  for (let i = 0; i < 44; i++) { const p = document.createElement('i'); p.className = 'cf'; p.style.cssText = `left:${50 + (Math.random() - .5) * 20}%;background:${c[i % 4]};--x:${(Math.random() - .5) * 640}px;--r:${Math.random() * 720}deg;animation-delay:${Math.random() * .15}s`; document.body.appendChild(p); setTimeout(() => p.remove(), 1800); }
}

/* ---------- profil ---------- */
function profile(first) {
  const m = S.me || { nama: '', divisi: '', foto: '' }; let foto = '';
  modal(`<h2>${first ? 'Selamat datang! Isi profilmu' : 'My profile'}</h2><div style="display:flex;gap:14px;align-items:center"><div class="ph" id="p_f" style="width:90px;aspect-ratio:1;border-radius:50%;flex:none;${m.foto ? `background-image:url(${E(m.foto)})` : ''}">${m.foto ? '' : 'Foto'}</div><div style="flex:1;color:var(--mut);font-size:13px">Login sebagai<br><b style="color:var(--ink)">${E(S.me ? S.me.email : 'akun Google kamu')}</b></div></div>
<input type="file" id="fi" accept="image/*" class="hide"><label>Nama</label><input id="pn" value="${E(m.nama)}"><label>Divisi</label>${divPick('pdiv', m.divisi)}<label>${m.wajibGanti ? 'Buat password baru (wajib)' : 'Ganti password (kosongkan jika tidak)'}</label><input id="pw" type="password" placeholder="Minimal 5 karakter" autocomplete="new-password">
<div class="act">${first ? '' : '<button class="btn g" onclick="logout()">Logout</button><button class="btn g" onclick="close_()">Tutup</button>'}<button class="btn" id="ps">Simpan</button></div>`, first);
  $('#p_f').onclick = () => $('#fi').click();
  $('#fi').onchange = async e => { if (e.target.files[0]) { foto = await img(e.target.files[0], 400); $('#p_f').style.backgroundImage = `url(${foto})`; $('#p_f').textContent = ''; } };
  $('#ps').onclick = async () => {
    const d = { nama: $('#pn').value, divisi: divGet('pdiv'), foto, sandi: $('#pw').value }; if (!d.nama.trim() || !d.divisi.trim()) return toast('Nama dan divisi wajib diisi'); if (m.wajibGanti && !d.sandi) return toast('Buat password baru dulu ya');
    apply(await api('saveProfile', d, 'Menyimpan profil')); close_(); toast('Profil tersimpan ✓'); go();
  };
}
</script><script>
(function(){
  var b=document.body,hb=document.getElementById('hb'),mq=matchMedia('(max-width:767px)');
  function set(o){b.classList.toggle('nav-open',o);hb.setAttribute('aria-expanded',o);hb.setAttribute('aria-label',o?'Tutup menu':'Buka menu')}
  hb.onclick=function(){set(!b.classList.contains('nav-open'))};
  document.getElementById('scrim').onclick=function(){set(false)};
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){set(false)})});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false)});
  mq.addEventListener('change',function(){set(false)});
})();
</script>
</body></html>
