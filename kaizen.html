<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaizen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fd:'Bricolage Grotesque',sans-serif;--fb:'Plus Jakarta Sans',sans-serif;--fw:700;--ink:#1e2747;--mut:#76819f;--bg:#fcfdff;--line:#e9edf9;--acc:#4f6bff;--acc2:#27c6a3;--t0:#eef1ff;--t1:#e0e7ff;--t2:#d8f5ea;--sh:#4f6bff22;--ring:#4f6bff55}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 var(--fb);color:var(--ink);background:var(--bg);background-image:radial-gradient(640px 320px at 8% -6%,var(--t1),transparent),radial-gradient(520px 300px at 98% 0,var(--t2),transparent);background-repeat:no-repeat;min-height:100vh}
h1,h2,h3{font-family:var(--fd);font-weight:var(--fw)}button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#fffffff0;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
header h1{font-size:24px;display:flex;align-items:center;gap:10px}.sp{flex:1}
.lg{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-size:18px}
.tabs{display:flex;gap:2px;background:var(--t0);padding:4px;border-radius:99px}
.tab{border:0;background:none;padding:8px 16px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--mut);transition:.2s;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{background:#fff;color:var(--acc);box-shadow:0 2px 8px var(--sh)}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--t1);display:grid;place-items:center;font-weight:700;color:var(--acc);cursor:pointer;overflow:hidden;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
main{max-width:1100px;margin:auto;padding:26px 20px 100px}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}#stats:empty{display:none}
.st{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.st i{position:absolute;right:-16px;top:-16px;width:62px;height:62px;border-radius:50%;background:var(--c)}
.st b{font:var(--fw) 30px/1.1 var(--fd)}.st span{color:var(--mut);font-size:13px}
.pg{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 16px}.pg>div:first-child{display:flex;justify-content:space-between;font-size:13px}.pg b{font-family:var(--fb)}
.bb{height:7px;background:var(--t0);border-radius:9px;overflow:hidden;margin-top:6px}.bb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}.bar:empty{display:none}
.bar>*{padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:#fff;min-width:0}.bar input[type=search]{flex:1;min-width:160px}
.btn{border:0;background:var(--acc);color:#fff;font-weight:700;padding:10px 20px;border-radius:99px;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px var(--ring)}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.g:hover{box-shadow:0 6px 14px var(--sh)}.btn[disabled]{background:#c9cfe2;transform:none;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px var(--sh)}
.s-plan,.plan{--c0:#e8edff;--c1:#4458d6}.s-progress,.progress{--c0:#fff2c9;--c1:#a86f00}.s-hold,.hold{--c0:#ffe1e1;--c1:#c23b3b}.s-done,.done{--c0:#d8f5ea;--c1:#12805f}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.stg span{height:5px;border-radius:9px;background:var(--line)}.stg span.on{background:var(--c1)}
.who{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}.who b{display:block;font-size:14px;color:var(--ink)}
.card h3{font-size:19px;line-height:1.2}.card p{color:#47506b;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-top:auto;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;background:var(--c0,var(--t0));color:var(--c1,var(--ink));padding:3px 11px;border-radius:99px;font-weight:700;font-size:12px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}
.tag{font-size:12px;font-weight:700;color:var(--acc)}
.ok{background:var(--t2);color:#0e7a5c;font-weight:700;font-size:12px;padding:4px 11px;border-radius:99px;align-self:flex-start}
.nb{background:var(--t0);border-radius:14px;padding:12px;margin:10px 0}.nb p{margin-top:6px}.empty{text-align:center;color:var(--mut);padding:60px 0}
.sc{background:var(--t2);color:#0e7a5c;border-radius:99px;padding:2px 12px;font:var(--fw) 18px var(--fd)}.sc.no{background:var(--t0);color:var(--mut);font:600 12px var(--fb);padding:5px 11px}
.fab{position:fixed;right:20px;bottom:20px;box-shadow:0 10px 24px var(--ring);padding:14px 24px;z-index:4}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:14px}
.pd{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.pd.r1{background:linear-gradient(180deg,#fff0b8,#fff 90%);padding-top:28px}.pd.r2{background:var(--t0)}.pd.r3{background:var(--t2)}
.pd .av{width:56px;height:56px;font-size:22px}.pd small,.lr small{color:var(--mut);font-size:12px}
.rk{font:var(--fw) 13px var(--fd);width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.pd .sv{font:var(--fw) 28px/1.1 var(--fd);color:var(--acc)}
.lst{display:grid;gap:8px}.lr{display:grid;grid-template-columns:28px 38px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.lr .n{font:var(--fw) 16px var(--fd);color:var(--mut);text-align:center}.rt{text-align:right}.rt b{font:var(--fw) 20px var(--fd);color:var(--acc);display:block}
.ov{position:fixed;inset:0;background:#1e274766;display:grid;place-items:center;z-index:20;padding:14px;opacity:0;pointer-events:none;transition:.25s}.ov.on{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:28px;padding:26px;width:min(660px,100%);max-height:92vh;overflow:auto;transform:translateY(20px) scale(.98);transition:.3s}.ov.on .modal{transform:none}
.modal h2{font-size:27px;margin-bottom:12px}label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
.modal input:not([type=file]),.modal select,.modal textarea{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.modal input:focus,.modal select:focus,.modal textarea:focus,.bar>*:focus,.lf input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
textarea{min-height:100px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{aspect-ratio:4/3;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;color:var(--mut);cursor:pointer;background-size:cover;background-position:center;font-size:13px;text-align:center;background-color:var(--t0)}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.dr{font-size:12px;color:var(--mut);margin-top:8px}.box{background:var(--t0);border-radius:18px;padding:14px;margin-top:16px}
#login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}
#login h1{font-size:clamp(42px,9vw,80px);line-height:1.05;letter-spacing:-1px;margin-bottom:22px}
.lf{display:grid;gap:10px;text-align:left}.lf input{padding:13px 16px;border:1px solid var(--line);border-radius:99px;background:#fff}.lf a{color:var(--acc);font-size:14px;text-align:center;font-weight:600}
.tw{overflow:auto;border-radius:18px;border:1px solid var(--line)}#tbl{background:#fff;padding:28px;min-width:640px}#tbl h2{font-size:28px}
table{border-collapse:collapse;width:100%;margin-top:14px;font-size:14px}th{background:var(--acc);color:#fff;text-align:left;padding:9px 10px}td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.sub td{background:var(--t0);font-weight:700}tr.dv td{background:var(--ink);color:#fff;font-weight:700;font-family:var(--fd)}td.n{text-align:center;font-weight:700}
#ld{position:fixed;inset:0;background:#fffffff0;z-index:50;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.25s}#ld.on{opacity:1;pointer-events:auto}
.lb{width:min(300px,80vw);text-align:center}.trk{height:10px;background:var(--t0);border-radius:9px;overflow:hidden;margin:14px 0 8px}
#lf{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width .2s}#lp{font:var(--fw) 42px var(--fd)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;z-index:60;transition:.35s}#toast.on{transform:translate(-50%,0)}
@media(max-width:640px){.tabs{order:3;width:100%;overflow:auto}header{padding:10px 14px}.pod{gap:6px}.pd{padding:12px 4px}.pd.r1{padding-top:20px}.pd b{font-size:13px}.pd .sv{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- tambahan: kategori, thumbnail, penangan, animasi, mobile ---- */
#hd h2{font-size:clamp(34px,6vw,56px);line-height:1.04;letter-spacing:-1px}#hd p{color:var(--mut);margin:6px 0 22px}
.chk{display:flex;flex-wrap:wrap;gap:8px}.cb{display:inline-flex;align-items:center;gap:7px;margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-weight:600;transition:.2s}
.cb:has(input:checked){background:var(--t1);border-color:var(--acc);color:var(--acc)}.modal .cb input{width:auto!important;padding:0;accent-color:var(--acc)}
.th{display:grid;grid-template-columns:1fr 1fr;gap:6px}.th div{aspect-ratio:4/3;border-radius:12px;background:var(--t0) center/cover;position:relative}
.th em{position:absolute;left:6px;bottom:6px;font:600 10px var(--fb);font-style:normal;background:#fffffff0;padding:2px 8px;border-radius:99px}
.tk{display:grid;gap:8px;background:var(--t0);border-radius:14px;padding:10px 12px}.tk small{font-weight:700;color:var(--ink)}
.card{animation:up .45s both;animation-delay:calc(var(--i,0)*45ms)}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.cf{position:fixed;top:55%;width:9px;height:14px;border-radius:2px;z-index:70;pointer-events:none;animation:cf 1.4s cubic-bezier(.2,.8,.3,1) forwards}@keyframes cf{to{transform:translate(var(--x),380px) rotate(var(--r));opacity:0}}
@media(max-width:640px){header{backdrop-filter:none;background:#fff}main{padding-bottom:150px}
.tabs{position:fixed;left:12px;right:12px;bottom:12px;width:auto;order:0;justify-content:space-around;background:#fffffff2;backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 10px 30px #1e274728;z-index:8;overflow:visible}
.tab{flex:1;padding:10px 2px;font-size:12px;text-align:center}.fab{bottom:84px;right:14px}#toast{bottom:96px}
.ov{align-items:end;padding:0}.modal{width:100%;border-radius:28px 28px 0 0;max-height:90vh;transform:translateY(100%)}.ov.on .modal{transform:none}}
.modal h2{padding-right:44px}.x{position:sticky;top:0;z-index:3;display:grid;place-items:center;width:34px;height:34px;margin:0 0 -34px auto;border:0;border-radius:50%;background:var(--t1);color:var(--ink);font-size:15px;cursor:pointer;transition:.2s}.x:hover{transform:rotate(90deg)}
</style></head><body>

<section id="login"><div style="width:min(380px,100%)"><h1>Kaizen.<br>Perbaikan kecil,<br>dampak besar.</h1>
<div class="lf"><input id="l_e" type="email" placeholder="Email kamu" autocomplete="username"><input id="l_n" class="hide" placeholder="Nama lengkap"><input id="l_p" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn" id="l_go">Masuk</button><a href="#" id="l_sw">Belum punya akun? Daftar</a><small id="l_h" class="hide" style="color:var(--mut)">Password awal 12345. Kamu akan diminta menggantinya setelah masuk.</small></div></div></section>

<div id="app" class="hide">
<header><h1><span class="lg">K</span>Kaizen</h1>
<nav class="tabs"><button class="tab" data-t="my">My Kaizen</button><button class="tab" data-t="all">All Kaizen</button><button class="tab" data-t="sy">Sayembara</button><button class="tab" data-t="lb">Peringkat</button></nav>
<span class="sp"></span><div class="av" id="me" title="My profile"></div></header>
<main><div id="hd"></div><div id="stats"></div><div class="bar" id="bar"></div><div class="grid" id="grid"></div></main>
<button class="btn fab" id="fab"></button>
</div>

<div class="ov" id="ov"><div class="modal" id="md"></div></div>
<div id="ld"><div class="lb"><div id="lp">0%</div><div class="trk"><div id="lf"></div></div><b>Tunggu ya…</b><div id="lm" style="color:var(--mut);font-size:13px"></div></div></div>
<div id="toast"></div>

<script>
/* ====== ISI 2 BARIS INI ====== */
const API = 'https://script.google.com/macros/s/AKfycbxtb9jjzL4FVHz5Im60obxQp2DYZjuKxmP7SUxFUy5FxMcHsN_ltEh9HLVxu2xjP8wdlg/exec';
/* Tambah kategori di sini */
const CATS = ['Cost', 'Environment', 'Time', 'Manpower'];
const STAT = ['plan', 'progress', 'hold', 'done'];
const DIVS = ['EXATA', 'JP Smart', 'JLCT', 'J-Expert', 'MC', 'IT', 'Finance', 'Exata Daily', 'Support', 'Yanoshi'], _seen = {};
// Samakan penulisan divisi (huruf besar-kecil dan spasi) supaya filter, kartu, dan peringkat konsisten
const canon = d => { d = String(d || '').trim().replace(/\s+/g, ' '); const k = d.toLowerCase(); return DIVS.find(x => x.toLowerCase() === k) || (_seen[k] = _seen[k] || d); };
const normAll = () => { [S.me].concat(S.users, S.kz, S.sy).forEach(o => { if (o && 'divisi' in o) o.divisi = canon(o.divisi); }); };
const divPick = (n, v) => { const o = v && !DIVS.includes(v); return `<div class="chk">${DIVS.map(d => `<label class="cb"><input type="radio" name="${n}" value="${d}" ${v === d ? 'checked' : ''}><span>${d}</span></label>`).join('')}<label class="cb"><input type="radio" name="${n}" value="__o" ${o ? 'checked' : ''}><span>Isi sendiri</span></label></div><input id="${n}_o" class="${o ? '' : 'hide'}" placeholder="Tulis divisimu" value="${o ? E(v) : ''}" style="margin-top:8px">`; };
const divGet = n => { const r = document.querySelector(`[name=${n}]:checked`); return !r ? '' : r.value === '__o' ? $('#' + n + '_o').value.trim() : r.value; };
document.addEventListener('change', e => { const o = e.target.type === 'radio' && document.getElementById(e.target.name + '_o'); if (o) o.classList.toggle('hide', e.target.value !== '__o'); });

const $ = s => document.querySelector(s), E = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = { tab: localStorage.kz_tab || 'my', tok: localStorage.kz_tok || '', me: null, users: [], kz: [], sy: [], f: {} };

/* ---------- loader + api ---------- */
let LT, LP = 0;
const setP = p => { $('#lf').style.width = p + '%'; $('#lp').textContent = Math.round(p) + '%'; };
function loader(on, msg) {
  clearInterval(LT);
  if (on) { LP = 0; setP(0); $('#lm').textContent = msg || ''; $('#ld').classList.add('on'); LT = setInterval(() => setP(LP += (92 - LP) * .06), 120); }
  else { setP(100); setTimeout(() => $('#ld').classList.remove('on'), 250); }
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 3000); }
async function api(action, data, msg) {
  loader(1, msg); let r;
  try { r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action, token: S.tok, data }) })).json(); }
  catch (e) { loader(0); toast('Koneksi gagal, coba lagi'); throw e; }
  loader(0);
  if (!r.ok) { toast(r.error); if (/sesi/i.test(r.error)) logout(); throw new Error(r.error); }
  return r.data;
}
function apply(d) {
  if (d.token) { S.tok = d.token; localStorage.kz_tok = d.token; } S.me = d.me; S.users = d.users; S.kz = d.kaizen; S.sy = d.sayembara; normAll(); }

/* ---------- login ---------- */
let REG = false;
window.onload = () => {
  $('#l_sw').onclick = e => {
    e.preventDefault(); REG = !REG;
    $('#l_n').classList.toggle('hide', !REG); $('#l_p').classList.toggle('hide', REG); $('#l_h').classList.toggle('hide', !REG);
    $('#l_go').textContent = REG ? 'Daftar' : 'Masuk'; $('#l_sw').textContent = REG ? 'Sudah punya akun? Masuk' : 'Belum punya akun? Daftar';
  };
  $('#l_go').onclick = async () => {
    const email = $('#l_e').value.trim().toLowerCase(), nama = $('#l_n').value.trim(), sandi = $('#l_p').value;
    if (!email || (REG ? !nama : !sandi)) return toast(REG ? 'Isi email dan nama' : 'Isi email dan password');
    const r = await api(REG ? 'register' : 'login', { email, nama, sandi }, REG ? 'Membuat akun' : 'Masuk');
    S.tok = r.token; localStorage.kz_tok = S.tok; boot();
  };
  document.querySelectorAll('.lf input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') $('#l_go').click(); });
  if (S.tok) boot();
};
async function boot() {
  try { apply(await api('load', {}, 'Mengambil data')); } catch (e) { return; }
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  if (!S.me.divisi || S.me.wajibGanti) return profile(true);
  go();
}
function logout() { localStorage.removeItem('kz_tok'); location.reload(); }

/* ---------- helpers ---------- */
const U = e => S.users.find(u => u.email === e) || { nama: e, divisi: '', foto: '' };
const avatar = (u, cls = '') => u.foto ? `<img class="av ${cls}" src="${E(u.foto)}">` : `<div class="av ${cls}">${E((u.nama || '?')[0]).toUpperCase()}</div>`;
const fdate = d => d ? new Date(d + 'T00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
function img(file, max = 1000) {
  return new Promise(res => {
    const fr = new FileReader(); fr.onload = () => { const i = new Image(); i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8)); }; i.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
function modal(h, lock) { $('#md').innerHTML = (lock ? '' : '<button class="x" onclick="close_()" aria-label="Tutup">✕</button>') + h; $('#md').scrollTop = 0; $('#ov').classList.add('on'); }
function close_() { $('#ov').classList.remove('on'); }

/* ---------- tabs, filter, list ---------- */
const FIELDS = {
  my: ['status', 'jenis', 'nilai', 'due', 'sort', 'q'], all: ['divisi', 'jenis', 'sort', 'q'], sy: ['divisi', 'sort', 'q'], lb: []
};
function go(t) {
  if (t) { S.tab = t; localStorage.kz_tab = t; }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  $('#me').outerHTML = avatar(S.me).replace('class="av', 'id="me" title="My profile" class="av'); $('#me').onclick = () => profile();
  $('#fab').textContent = S.tab === 'sy' ? '+ Sayembara baru' : '+ Kaizen baru'; $('#fab').onclick = () => S.tab === 'sy' ? newSy() : form(); $('#fab').classList.toggle('hide', S.tab === 'lb');
  const TT = { my: ['Kaizen saya', `Halo, ${E(S.me.nama.split(' ')[0])} 👋 Yuk catat perbaikan kecilmu hari ini.`], all: ['Semua kaizen', 'Lihat ide perbaikan dari seluruh tim.'], sy: ['Sayembara', 'Masalah yang butuh bantuan tim. Satu sayembara bisa ditangani maksimal 3 orang.'], lb: ['Peringkat', 'Diurutkan dari rata-rata skor juri.'] };
  $('#hd').innerHTML = `<h2>${TT[S.tab][0]}</h2><p>${TT[S.tab][1]}</p>`;
  const f = S.f[S.tab] = S.f[S.tab] || {}, divs = [...new Set(S.users.map(u => u.divisi).filter(Boolean))];
  const mk = {
    status: `<select data-k="status"><option value="">Semua status</option>${STAT.map(s => `<option ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`,
    jenis: `<select data-k="jenis"><option value="">Pribadi + sayembara</option><option value="pribadi" ${f.jenis === 'pribadi' ? 'selected' : ''}>Pribadi</option><option value="sayembara" ${f.jenis === 'sayembara' ? 'selected' : ''}>Sayembara</option></select>`,
    nilai: `<select data-k="nilai"><option value="">Semua (sudah/belum dinilai)</option><option value="y" ${f.nilai === 'y' ? 'selected' : ''}>Sudah dinilai</option><option value="n" ${f.nilai === 'n' ? 'selected' : ''}>Belum dinilai</option></select>`,
    divisi: `<select data-k="divisi"><option value="">Semua divisi</option>${divs.map(d => `<option ${f.divisi === d ? 'selected' : ''}>${E(d)}</option>`).join('')}</select>`,
    due: `<input type="date" data-k="due" value="${f.due || ''}" title="Due date maksimal">`,
    sort: `<select data-k="sort"><option value="new">Terbaru dulu</option><option value="old" ${f.sort === 'old' ? 'selected' : ''}>Terlama dulu</option></select>`,
    q: `<input type="search" data-k="q" placeholder="Cari kata apa saja…" value="${E(f.q || '')}">`
  };
  $('#bar').innerHTML = FIELDS[S.tab].map(k => mk[k]).join('');
  $('#bar').oninput = e => { f[e.target.dataset.k] = e.target.value; draw(); };
  draw();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.t));

function draw() {
  stats(); if (S.tab === 'lb') return board();
  const f = S.f[S.tab] || {}, q = (f.q || '').toLowerCase();
  let a = S.tab === 'sy' ? S.sy : S.kz.filter(k => S.tab === 'all' || k.email === S.me.email);
  a = a.filter(x => (!f.status || x.status === f.status) && (!f.nilai || (f.nilai === 'y') === scored(x)) && (!f.jenis || x.jenis === f.jenis) && (!f.divisi || x.divisi === f.divisi) && (!f.due || (x.due && x.due <= f.due)) && (!q || JSON.stringify(x).toLowerCase().includes(q)));
  a.sort((x, y) => f.sort === 'old' ? x.dibuat - y.dibuat : y.dibuat - x.dibuat);
  $('#grid').innerHTML = a.length ? a.map(S.tab === 'sy' ? cardSy : cardKz).join('') : `<div class="empty" style="grid-column:1/-1">Belum ada data di sini.<br>Coba ubah filter atau tambah yang baru.</div>`;
  document.querySelectorAll('[data-id]').forEach(c => c.onclick = e => { if (e.target.closest('button')) return; S.tab === 'sy' ? 0 : (S.tab === 'my' ? form(c.dataset.id) : view(c.dataset.id)); });
  document.querySelectorAll('[data-take]').forEach(b => b.onclick = () => take(b.dataset.take));
  document.querySelectorAll('.card').forEach((c, i) => c.style.setProperty('--i', Math.min(i, 12)));
}
const who = (e, d) => { const u = U(e); return `<div class="who">${avatar(u)}<div><b>${E(u.nama)}</b>${E(u.divisi)}</div></div>`; };
const SL = { plan: 'Rencana', progress: 'Berjalan', hold: 'Tertahan', done: 'Selesai' }, SN = { plan: 1, progress: 2, hold: 2, done: 4 };
const thumbs = k => (k.before || k.after) ? `<div class="th">${['before', 'after'].map(n => `<div style="${k[n] ? `background-image:url(${E(k[n])})` : ''}"><em>${n === 'before' ? 'Before' : 'After'}</em></div>`).join('')}</div>` : '';
const cardKz = k => `<div class="card s-${k.status}" data-id="${k.id}">${who(k.email)}
<div class="stg">${[1, 2, 3, 4].map(i => `<span class="${i <= SN[k.status] ? 'on' : ''}"></span>`).join('')}</div>${thumbs(k)}
<h3>${E(k.kategori)}</h3>${k.jenis === 'sayembara' ? `<span class="tag">★ ${E(k.masalah.split(':')[0])}</span>` : ''}
<p>${E(k.isi) || '<i>Belum diisi</i>'}</p><div class="meta"><span>Due ${fdate(k.due)}</span><span class="pill">${SL[k.status] || k.status}</span></div>${dinilai(k)}</div>`;

const t = (c, v, l) => `<div class="st" style="--c:${c}"><i></i><b>${v}</b><span>${l}</span></div>`;
const fmt = v => v == null ? '–' : (Math.round(v * 10) / 10).toString().replace('.', ',');
function podium(rows, sub) {
  const pd = (r, i) => `<div class="pd r${i + 1}"><span class="rk">${i + 1}</span>${avatar(r.u)}<b>${E(r.u.nama)}</b><small>${E(r.u.divisi)}</small><span class="sv">${fmt(r.a)}</span><small>${sub(r)}</small></div>`;
  const top = rows.slice(0, 3), ord = [[top[1], 1], [top[0], 0], [top[2], 2]].filter(x => x[0]).map(x => pd(x[0], x[1])).join('');
  $('#grid').innerHTML = rows.length ? `<div style="grid-column:1/-1"><div class="pod">${ord}</div><div class="lst">${rows.slice(3).map((r, i) => `<div class="lr"><span class="n">${i + 4}</span>${avatar(r.u)}<div><b>${E(r.u.nama)}</b> <small>${E(r.u.divisi)}</small><div class="bb"><i style="width:${r.a || 0}%"></i></div></div><div class="rt"><b>${fmt(r.a)}</b><small>${sub(r)}</small></div></div>`).join('')}</div></div>` : '<div class="empty" style="grid-column:1/-1">Belum ada skor untuk diperingkat.</div>';
}

function stats() {
  const me = S.kz.filter(k => k.email === S.me.email), n = s => me.filter(k => k.status === s).length, sc = me.filter(k => k.nilai && k.nilai.length).map(rata);
  $('#stats').innerHTML = S.tab === 'my' ? t('#e0e7ff', me.length, 'Kaizen saya') + t('#fff2c9', n('progress'), 'Sedang berjalan') + t('#d8f5ea', n('done'), 'Selesai') + t('#ffe3ef', fmt(sc.length ? sc.reduce((a, b) => a + b) / sc.length : null), 'Rata-rata skor juri')
    : S.tab === 'all' ? t('#e0e7ff', S.kz.length, 'Total kaizen') + t('#d8f5ea', S.kz.filter(k => k.status === 'done').length, 'Selesai') + t('#fff2c9', new Set(S.kz.map(k => k.email)).size, 'Kontributor') + t('#ffe3ef', S.kz.filter(scored).length, 'Sudah dinilai')
    : S.tab === 'sy' ? t('#e0e7ff', S.sy.length, 'Sayembara') + t('#fff2c9', S.sy.filter(s => takers(s).length < 3).length, 'Masih butuh penangan') + t('#d8f5ea', S.sy.filter(s => s.ambilEmail).length, 'Sudah diambil') : '';
}
function board() {
  const m = {};
  S.kz.forEach(k => { const r = m[k.email] = m[k.email] || { u: U(k.email), n: 0, d: 0, s: [] }; r.n++; if (k.status === 'done') r.d++; if (k.nilai && k.nilai.length) r.s.push(rata(k)); });
  const rows = Object.values(m).map(r => ({ ...r, a: r.s.length ? r.s.reduce((x, y) => x + y) / r.s.length : null })).sort((x, y) => (y.a ?? -1) - (x.a ?? -1) || y.d - x.d || y.n - x.n);
  podium(rows, r => `${r.d}/${r.n} selesai`);
}
const takers = s => String(s.ambilEmail || '').split(',').filter(Boolean);
const cardSy = s => { const t = takers(s), mine = t.includes(S.me.email);
  return `<div class="card s-plan" style="cursor:default">${who(s.email)}<h3>Butuh bantuan</h3><p style="-webkit-line-clamp:5">${E(s.problem)}</p>
${t.length ? `<div class="tk"><small>Sedang ditangani oleh (${t.length}/3)</small>${t.map(e => who(e)).join('')}</div>` : ''}
<div class="meta"><span>Due ${fdate(s.due)}</span>${mine ? '<span class="pill done">Kamu ikut menangani</span>' : t.length >= 3 ? '<span class="pill hold">Penuh 3/3</span>' : `<button class="btn" data-take="${s.id}">Aku tangani ini</button>`}</div></div>`; };

async function take(id) {
  if (!confirm('Ikut menangani sayembara ini? Maksimal 3 orang, dan akan masuk ke My Kaizen kamu.')) return;
  apply(await api('takeSayembara', { id }, 'Mengambil sayembara')); toast('Sayembara masuk ke My Kaizen'); go('my');
}

/* ---------- nilai dari juri ---------- */
const rata = k => Math.round(k.nilai.reduce((s, n) => s + Number(n.skor), 0) / k.nilai.length * 10) / 10;
const scored = k => !!((k.nilai && k.nilai.length) || k.dinilai);
const dinilai = k => k.nilai && k.nilai.length ? `<span class="ok">✓ Sudah dinilai · skor ${rata(k)}</span>` : k.dinilai ? `<span class="ok">✓ Sudah dinilai</span>` : '';
const nilaiBox = k => k.nilai && k.nilai.length ? `<div class="nb"><b>✓ Sudah dinilai · rata-rata ${rata(k)}</b>${k.nilai.map(n => `<p><b>${E(n.juri)}: ${E(n.skor)}</b>${n.komentar ? '<br>' + E(n.komentar) : ''}</p>`).join('')}</div>` : '';

/* ---------- detail (read only) ---------- */
function view(id) {
  const k = S.kz.find(x => x.id === id), ph = (s, t) => s ? `<div><label>${t}</label><img src="${E(s)}" style="width:100%;border-radius:14px"></div>` : `<div><label>${t}</label><div class="ph">Belum ada foto</div></div>`;
  modal(`<h2>${E(k.kategori)}</h2>${who(k.email)}${k.masalah ? `<label>Sayembara</label><p>${E(k.masalah)}</p>` : ''}
<label>Detail kaizen</label><p>${E(k.isi) || '-'}</p><div class="two"><div><label>Due date</label>${fdate(k.due)}</div><div><label>Status</label>${k.status}</div></div>
<div class="two" style="margin-top:8px">${ph(k.before, 'Before')}${ph(k.after, 'After')}</div><div class="act"><button class="btn g" onclick="close_()">Tutup</button></div>`);
}

/* ---------- form kaizen (dengan draft otomatis) ---------- */
const DK = () => 'kz_draft_' + S.me.email;
function form(id) {
  const k = id ? S.kz.find(x => x.id === id) : null, dr = !id && JSON.parse(localStorage[DK()] || 'null'), v = k || dr || {};
  const sel = String(v.kategori || '').split(', ').filter(Boolean), oth = sel.filter(c => !CATS.includes(c)).join(', '), im = { before: v.before || '', after: v.after || '' };
  modal(`<h2>${k ? 'Update kaizen' : 'Kaizen baru'}</h2>${k ? nilaiBox(k) : ''}${k && k.masalah ? `<p class="tag">${E(k.masalah)}</p>` : ''}
<label>Kamu dari divisi mana</label>${divPick('fdiv', v.divisi || S.me.divisi)}
<label>Kaizen untuk apa (boleh pilih lebih dari satu)</label>
<div class="chk">${CATS.map(c => `<label class="cb"><input type="checkbox" name="cat" value="${c}" ${sel.includes(c) ? 'checked' : ''}><span>${c}</span></label>`).join('')}<label class="cb"><input type="checkbox" id="c_o" ${oth ? 'checked' : ''}><span>Isi sendiri</span></label></div>
<input id="f_oth" class="${oth ? '' : 'hide'}" placeholder="Tulis kategorimu" value="${E(oth)}" style="margin-top:8px">
<label>Apa kaizenmu</label><textarea id="f_isi">${E(v.isi)}</textarea>
<div class="two"><div><label>Rencana selesai tanggal</label><input type="date" id="f_due" value="${v.due || ''}"></div>
<div><label>Status</label><select id="f_st">${STAT.map(s => `<option ${v.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div></div>
<div class="two"><div><label>Foto before</label><div class="ph" id="p_before">Ketuk untuk unggah</div></div><div><label>Foto after</label><div class="ph" id="p_after">Ketuk untuk unggah</div></div></div>
<input type="file" id="fi" accept="image/*" class="hide"><div class="dr" id="dr">${dr ? 'Draft yang belum selesai dikembalikan.' : ''}</div>
<div class="act"><button class="btn g" onclick="close_()">Batal</button><button class="btn" id="sv">Simpan</button></div>`);
  let cur;
  const paint = n => { const p = $('#p_' + n); if (im[n]) { p.style.backgroundImage = `url(${im[n]})`; p.textContent = ''; } };
  ['before', 'after'].forEach(n => { paint(n); $('#p_' + n).onclick = () => { cur = n; $('#fi').click(); }; });
  $('#fi').onchange = async e => { if (e.target.files[0]) { im[cur] = await img(e.target.files[0]); paint(cur); e.target.value = ''; draft(); } };
  $('#c_o').onchange = () => $('#f_oth').classList.toggle('hide', !$('#c_o').checked);
  const get = () => ({ id: id || '', divisi: divGet('fdiv'), kategori: [...document.querySelectorAll('[name=cat]:checked')].map(x => x.value).concat($('#c_o').checked && $('#f_oth').value.trim() ? [$('#f_oth').value.trim()] : []).join(', '), isi: $('#f_isi').value.trim(), due: $('#f_due').value, status: $('#f_st').value, before: im.before, after: im.after });
  function draft() { if (id) return; try { localStorage[DK()] = JSON.stringify(get()); $('#dr').textContent = 'Draft tersimpan otomatis ✓'; } catch (e) { } }
  $('#md').oninput = draft;
  $('#sv').onclick = async () => {
    const d = get(); if (!d.divisi || !d.kategori || !d.isi || !d.due) return toast('Divisi, minimal satu kategori, isi, dan tanggal wajib diisi');
    apply(await api('saveKaizen', d, 'Menyimpan kaizen & mengunggah foto')); localStorage.removeItem(DK()); close_(); toast('Kaizen tersimpan ✓'); go('my'); if (d.status === 'done') setTimeout(confetti, 350);
  };
}

/* ---------- sayembara baru ---------- */
function newSy() {
  const k = 'kz_sy_' + S.me.email, d = JSON.parse(localStorage[k] || '{}');
  modal(`<h2>Sayembara baru</h2><label>Tulis di sini problem yang kamu gak bisa tangani sendiri</label><textarea id="s_p">${E(d.p)}</textarea>
<label>Due date</label><input type="date" id="s_d" value="${d.d || ''}"><div class="act"><button class="btn g" onclick="close_()">Batal</button><button class="btn" id="s_sv">Kirim</button></div>`);
  $('#md').oninput = () => localStorage[k] = JSON.stringify({ p: $('#s_p').value, d: $('#s_d').value });
  $('#s_sv').onclick = async () => {
    const p = $('#s_p').value.trim(), d = $('#s_d').value; if (!p || !d) return toast('Problem dan due date wajib diisi');
    apply(await api('addSayembara', { problem: p, due: d }, 'Mengirim sayembara')); localStorage.removeItem(k); close_(); toast('Sayembara terkirim ✓'); go('sy');
  };
}

function confetti() {
  const c = ['#4f6bff', '#27c6a3', '#ffd23f', '#ff6b9a'];
  for (let i = 0; i < 44; i++) { const p = document.createElement('i'); p.className = 'cf'; p.style.cssText = `left:${50 + (Math.random() - .5) * 20}%;background:${c[i % 4]};--x:${(Math.random() - .5) * 640}px;--r:${Math.random() * 720}deg;animation-delay:${Math.random() * .15}s`; document.body.appendChild(p); setTimeout(() => p.remove(), 1800); }
}

/* ---------- profil ---------- */
function profile(first) {
  const m = S.me || { nama: '', divisi: '', foto: '' }; let foto = '';
  modal(`<h2>${first ? 'Selamat datang! Isi profilmu' : 'My profile'}</h2><div style="display:flex;gap:14px;align-items:center"><div class="ph" id="p_f" style="width:90px;aspect-ratio:1;border-radius:50%;flex:none;${m.foto ? `background-image:url(${E(m.foto)})` : ''}">${m.foto ? '' : 'Foto'}</div><div style="flex:1;color:var(--mut);font-size:13px">Login sebagai<br><b style="color:var(--ink)">${E(S.me ? S.me.email : 'akun Google kamu')}</b></div></div>
<input type="file" id="fi" accept="image/*" class="hide"><label>Nama</label><input id="pn" value="${E(m.nama)}"><label>Divisi</label>${divPick('pdiv', m.divisi)}<label>${m.wajibGanti ? 'Buat password baru (wajib)' : 'Ganti password (kosongkan jika tidak)'}</label><input id="pw" type="password" placeholder="Minimal 5 karakter" autocomplete="new-password">
<div class="act">${first ? '' : '<button class="btn g" onclick="logout()">Logout</button><button class="btn g" onclick="close_()">Tutup</button>'}<button class="btn" id="ps">Simpan</button></div>`, first);
  $('#p_f').onclick = () => $('#fi').click();
  $('#fi').onchange = async e => { if (e.target.files[0]) { foto = await img(e.target.files[0], 400); $('#p_f').style.backgroundImage = `url(${foto})`; $('#p_f').textContent = ''; } };
  $('#ps').onclick = async () => {
    const d = { nama: $('#pn').value, divisi: divGet('pdiv'), foto, sandi: $('#pw').value }; if (!d.nama.trim() || !d.divisi.trim()) return toast('Nama dan divisi wajib diisi'); if (m.wajibGanti && !d.sandi) return toast('Buat password baru dulu ya');
    apply(await api('saveProfile', d, 'Menyimpan profil')); close_(); toast('Profil tersimpan ✓'); go();
  };
}
</script></body></html>
